name: ift-access
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
      POSTGRES_DB: ${POSTGRES_DB:-ift_access}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ift_access}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOW_INSECURE_DEV_COOKIES: ${ALLOW_INSECURE_DEV_COOKIES:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_DIR: /data/uploads
      CONTROLLER_MODE: ${CONTROLLER_MODE:-SIMULATED}
      HIKVISION_HOST: ${HIKVISION_HOST:-10.10.20.8}
      HIKVISION_PORT: ${HIKVISION_PORT:-8000}
      HIKVISION_USERNAME: ${HIKVISION_USERNAME:-}
      HIKVISION_PASSWORD: ${HIKVISION_PASSWORD:-}
      HIKVISION_CONNECT_TIMEOUT: ${HIKVISION_CONNECT_TIMEOUT:-3}
      HIKVISION_SDK_DIR: /opt/hikvision-sdk
      HIKVISION_PROCESS_TIMEOUT: ${HIKVISION_PROCESS_TIMEOUT:-40}
      HIKVISION_INITIAL_MINUTES: ${HIKVISION_INITIAL_MINUTES:-60}
      HIKVISION_HISTORY_WINDOW_MINUTES: ${HIKVISION_HISTORY_WINDOW_MINUTES:-15}
      HIKVISION_EVENT_LIMIT: ${HIKVISION_EVENT_LIMIT:-1000}
      HIKVISION_CONTROLLER_ID: ${HIKVISION_CONTROLLER_ID:-controller-1}
      SIMULATION_CONTROLS_ENABLED: ${SIMULATION_CONTROLS_ENABLED:-false}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT:-5242880}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      APPLICATION_URL: ${APPLICATION_URL:-http://localhost:5173}
      RECOVERY_CONTACT: ${RECOVERY_CONTACT:-Contact the IFT E-Library administrator in person.}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-STARTTLS}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
      # Local development migrations stay current across an owner PC reboot.
      - ./backend/alembic/versions:/app/backend/alembic/versions:ro
      - ./backend/app:/app/backend/app:ro
      - ./backend/native:/app/backend/native:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  database:
  uploads:
